version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: meu_postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGREE_DB}
    ports:
      - "${POSTGREES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - rede-interna

  app:
    build: .
    container_name: minha-aplicacao-web
    restart: always
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      - postgres-db
    networks:
      - rede-interna

networks:
  rede-interna:
    driver: bridge

volumes:
  db_data:
  